<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Take Your Brain</title>
<style>
:root{--bg1:#33363D;--bg2:#141518;--acc:#5CF2B4}
html,body{margin:0;height:100%;background:var(--bg2);font-family:system-ui,sans-serif;color:#fff}
body{display:grid;place-items:center;background:linear-gradient(135deg,var(--bg1),var(--bg2))}
.wrap{display:grid;justify-items:center;gap:20px;padding:16px}
svg{width:min(70vmin,520px);height:auto;overflow:visible}
.d{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1}
.hemi{stroke:#fff;stroke-width:40;animation:draw .75s cubic-bezier(.65,0,.35,1) .1s forwards}
.groove{stroke:#fff;stroke-width:32;animation:draw .45s cubic-bezier(.33,1,.68,1) forwards}
.g0{animation-delay:.45s}.g1{animation-delay:.49s}.g2{animation-delay:.53s}
.ring{stroke:var(--acc);stroke-width:44;animation:draw .9s cubic-bezier(.65,0,.35,1) .6s forwards}
.brain{transform-origin:512px 512px;opacity:0;animation:brainIn .8s cubic-bezier(.33,1,.68,1) .05s forwards,pulse .6s ease-in-out 1.5s}
.arrow{fill:none;stroke:var(--acc);stroke-width:44;stroke-linecap:round;stroke-linejoin:round;transform-origin:677.0px 226.2px;transform:scale(0);animation:pop .33s cubic-bezier(.34,1.9,.64,1) 1.42s forwards}
.glow{opacity:0;animation:glow 1.2s ease-out 1.45s}
.word{font-weight:700;letter-spacing:.04em;font-size:clamp(22px,5vmin,40px);opacity:0;transform:translateY(8px);animation:word .6s ease-out 1.8s forwards}
.word b{color:var(--acc)}
button{font:inherit;color:#fff;background:#ffffff14;border:1px solid #ffffff30;border-radius:999px;padding:10px 18px;cursor:pointer}
button:hover{background:#ffffff22}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes brainIn{from{opacity:0;transform:scale(.86)}45%{opacity:1}to{opacity:1;transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.045)}}
@keyframes pop{to{transform:scale(1)}}
@keyframes glow{20%{opacity:1}to{opacity:0}}
@keyframes word{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;animation-delay:0s!important}}
</style></head><body>
